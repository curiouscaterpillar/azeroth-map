<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azeroth Map</title>
<style>
  :root { --bg:#16110b; --edge:#6b5a33; --ink:#f3e9cf; --panel:#1b1610ee; --gold:#e8c26a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 Georgia, serif; overflow:hidden; }
  #map { width:100vw; height:100vh; display:block; cursor:grab; touch-action:none; }
  #map.drag { cursor:grabbing; }
  .zone circle { stroke:#1b1610; stroke-width:1.5; cursor:pointer; transition:r .15s; }
  .zone:hover circle, .zone.active circle { r:9; }
  .zone text { font-size:10px; fill:#f3e9cf; stroke:#1b1610; stroke-width:3px; paint-order:stroke; text-anchor:middle; pointer-events:none; font-weight:bold; }
  .zone text { opacity:0; transition:opacity .15s; }
  .zoomed .zone text, .zone:hover text, .zone.active text { opacity:1; }
  .zone.dim { opacity:.15; }
  .alliance circle { fill:#3a6fd8; } .horde circle { fill:#c8352d; }
  .contested circle { fill:#e8c26a; } .neutral circle { fill:#9ad06a; }
  #ui { position:fixed; top:12px; left:12px; width:min(300px, calc(100vw - 24px)); background:var(--panel); border:1px solid var(--gold); border-radius:8px; padding:12px; }
  h1 { margin:0 0 8px; font-size:18px; color:var(--gold); }
  input { width:100%; padding:6px 8px; border-radius:4px; border:1px solid var(--edge); background:#0f0c08; color:var(--ink); font:inherit; }
  #legend { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 0; font-size:12px; }
  #legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; background:var(--c); }
  #info { margin-top:10px; border-top:1px solid #6b5a3388; padding-top:8px; min-height:60px; }
  #info h2 { margin:0; font-size:16px; color:var(--gold); }
  #info .meta { font-size:12px; opacity:.8; margin:2px 0 6px; }
  #controls { position:fixed; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
  #controls button { width:36px; height:36px; font-size:18px; background:var(--panel); color:var(--gold); border:1px solid var(--gold); border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<svg id="map" viewBox="0 0 1000 655" xmlns="http://www.w3.org/2000/svg">
  <rect x="-3000" y="-3000" width="7000" height="7000" fill="#16110b"/>
  <g id="world">
    <image href="assets/azeroth.jpg" x="0" y="0" width="1000" height="655"/>
    <g id="zones"></g>
  </g>
</svg>

<div id="ui">
  <h1>Azeroth</h1>
  <input id="search" placeholder="Search zones…" autocomplete="off">
  <div id="legend">
    <span style="--c:#3a6fd8">Alliance</span><span style="--c:#c8352d">Horde</span>
    <span style="--c:#e8c26a">Contested</span><span style="--c:#9ad06a">Neutral</span>
  </div>
  <div id="info"><em>Click a zone to learn about it. Drag to pan, scroll to zoom.</em></div>
</div>
<div id="controls">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">−</button>
  <button id="reset" title="Reset view">⟲</button>
</div>

<script>
const ZONES = [
  // Kalimdor
  ["Teldrassil","Kalimdor","alliance",150,160,"The great World Tree off Kalimdor's northwest coast."],
  ["Azuremyst Isle","Kalimdor","alliance",75,245,"Island where the draenei's ship, the Exodar, crashed."],
  ["Darkshore","Kalimdor","alliance",215,215,"Misty northern coast of the night elves."],
  ["Winterspring","Kalimdor","neutral",290,215,"Snowy valleys home to Everlook and frostsabers."],
  ["Mount Hyjal","Kalimdor","neutral",262,250,"Sacred mountain and home of Nordrassil."],
  ["Ashenvale","Kalimdor","contested",215,282,"Ancient night elf forest, long fought over by orc loggers."],
  ["Orgrimmar","Kalimdor","horde",298,305,"Capital of the Horde, carved into the red canyons of Durotar."],
  ["Durotar","Kalimdor","horde",302,348,"Harsh, rocky homeland of the orcs, named after Durotan."],
  ["Desolace","Kalimdor","contested",148,360,"Barren wasteland haunted by centaur clans."],
  ["The Barrens","Kalimdor","horde",245,372,"Vast savanna crossroads of Kalimdor."],
  ["Thunder Bluff","Kalimdor","horde",190,405,"Tauren capital atop towering mesas in Mulgore."],
  ["Dustwallow Marsh","Kalimdor","contested",282,432,"Swamp home to Theramore and the black dragon Onyxia."],
  ["Feralas","Kalimdor","contested",145,452,"Lush jungle of ancient elven ruins and giants."],
  ["Thousand Needles","Kalimdor","contested",225,470,"Towering stone spires, flooded in the Cataclysm."],
  ["Un'Goro Crater","Kalimdor","neutral",195,518,"Primeval crater full of dinosaurs and Titan secrets."],
  ["Tanaris","Kalimdor","neutral",265,530,"Desert home of Gadgetzan and the Caverns of Time."],
  ["Silithus","Kalimdor","neutral",145,545,"Insect-plagued desert where Sargeras' sword struck."],
  ["Uldum","Kalimdor","neutral",195,582,"Titan-forged land of the tol'vir."],
  // Eastern Kingdoms
  ["Silvermoon City","Eastern Kingdoms","horde",868,160,"Blood elf capital in Quel'Thalas."],
  ["Eastern Plaguelands","Eastern Kingdoms","contested",862,215,"Blighted land still scarred by the Scourge."],
  ["Undercity","Eastern Kingdoms","horde",772,238,"Forsaken capital beneath the ruins of Lordaeron."],
  ["Tirisfal Glades","Eastern Kingdoms","horde",738,252,"Gloomy homeland of the Forsaken."],
  ["Hinterlands","Eastern Kingdoms","contested",862,262,"Wild highlands of the Wildhammer dwarves and trolls."],
  ["Hillsbrad Foothills","Eastern Kingdoms","horde",780,312,"Rolling hills and the town of Tarren Mill."],
  ["Arathi Highlands","Eastern Kingdoms","contested",852,292,"Former seat of the ancient human kingdom of Arathor."],
  ["Wetlands","Eastern Kingdoms","contested",805,352,"Rain-soaked marsh dividing north and south."],
  ["Dun Morogh","Eastern Kingdoms","alliance",785,402,"Snowy home of dwarves and gnomes."],
  ["Ironforge","Eastern Kingdoms","alliance",812,392,"Dwarven capital hewn into the mountain Khaz Modan."],
  ["Searing Gorge","Eastern Kingdoms","contested",840,432,"Volcanic pit of the Dark Iron dwarves."],
  ["Burning Steppes","Eastern Kingdoms","contested",842,465,"Scorched land below Blackrock Mountain."],
  ["Stormwind City","Eastern Kingdoms","alliance",788,488,"Shining capital of the human kingdom and the Alliance."],
  ["Elwynn Forest","Eastern Kingdoms","alliance",822,506,"Peaceful farmland and forest around Stormwind."],
  ["Redridge Mountains","Eastern Kingdoms","alliance",862,495,"Rugged hills overrun by gnolls and orcs."],
  ["Westfall","Eastern Kingdoms","alliance",775,525,"Farmland troubled by the Defias Brotherhood."],
  ["Duskwood","Eastern Kingdoms","contested",820,532,"Ever-dark forest stalked by worgen and undead."],
  ["Blasted Lands","Eastern Kingdoms","contested",862,548,"Demon-scarred land around the Dark Portal."],
  ["Stranglethorn Vale","Eastern Kingdoms","contested",800,568,"Dense jungle of trolls, pirates, and Booty Bay."],
  // Northrend
  ["Borean Tundra","Northrend","contested",410,135,"Frozen western shore home to the tuskarr."],
  ["Icecrown","Northrend","contested",470,68,"Seat of the Lich King's Frozen Throne."],
  ["Storm Peaks","Northrend","neutral",560,48,"Titan-touched peaks of Ulduar."],
  ["Dalaran","Northrend","neutral",540,110,"Floating city of the Kirin Tor mages."],
  ["Dragonblight","Northrend","contested",480,140,"Ancient dragon graveyard and Wyrmrest Temple."],
  ["Grizzly Hills","Northrend","contested",612,130,"Pine forests of furbolgs and ancient trolls."],
  ["Howling Fjord","Northrend","contested",638,188,"Fjords of the vrykul on Northrend's east coast."],
  // Sea
  ["The Maelstrom","Great Sea","neutral",530,320,"Endless whirlpool left where the Well of Eternity imploded."],
];

const svg = document.getElementById("map");
const zonesG = document.getElementById("zones");
const info = document.getElementById("info");
const NS = "http://www.w3.org/2000/svg";
const label = { alliance:"Alliance", horde:"Horde", contested:"Contested", neutral:"Neutral / Sanctuary" };
let active = null;

for (const [name, cont, fac, x, y, desc] of ZONES) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", `zone ${fac}`);
  g.innerHTML = `<circle cx="${x}" cy="${y}" r="6"/><text x="${x}" y="${y - 10}">${name}</text>`;
  g.dataset.name = name.toLowerCase();
  g.addEventListener("click", e => { e.stopPropagation(); select(g, name, cont, fac, x, y, desc); });
  zonesG.appendChild(g);
}

function select(g, name, cont, fac, x, y, desc) {
  active?.classList.remove("active");
  active = g; g.classList.add("active");
  info.innerHTML = `<h2>${name}</h2><div class="meta">${cont} · ${label[fac]}</div><div>${desc}</div>`;
  if (x != null) flyTo(x, y, 3);
}

// --- Pan & zoom via viewBox ---
const BASE = { x:0, y:0, w:1000, h:655 };
let vb = { ...BASE };
const apply = () => {
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.classList.toggle("zoomed", vb.w < BASE.w / 1.6); // only show all labels when zoomed in
};

function toWorld(cx, cy) {
  const r = svg.getBoundingClientRect();
  const s = Math.max(vb.w / r.width, vb.h / r.height); // preserveAspectRatio meet
  return { x: vb.x + (cx - r.left - (r.width - vb.w / s) / 2) * s, y: vb.y + (cy - r.top - (r.height - vb.h / s) / 2) * s };
}
function zoom(factor, cx, cy) {
  const nw = Math.min(BASE.w * 1.5, Math.max(BASE.w / 8, vb.w * factor));
  const f = nw / vb.w;
  vb.x = cx - (cx - vb.x) * f; vb.y = cy - (cy - vb.y) * f;
  vb.w = nw; vb.h = vb.w * BASE.h / BASE.w;
  apply();
}
function flyTo(x, y, z) {
  const from = { ...vb }, w = BASE.w / z, h = BASE.h / z;
  const to = { x: x - w / 2, y: y - h / 2, w, h };
  const t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / 400), e = 1 - Math.pow(1 - k, 3);
    for (const p in vb) vb[p] = from[p] + (to[p] - from[p]) * e;
    apply(); if (k < 1) requestAnimationFrame(step);
  })(t0);
}

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const p = toWorld(e.clientX, e.clientY);
  zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, p.x, p.y);
}, { passive:false });

let drag = null;
svg.addEventListener("pointerdown", e => { drag = toWorld(e.clientX, e.clientY); svg.classList.add("drag"); });
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = toWorld(e.clientX, e.clientY);
  vb.x += drag.x - p.x; vb.y += drag.y - p.y; apply();
});
window.addEventListener("pointerup", () => { drag = null; svg.classList.remove("drag"); });

const centerZoom = f => zoom(f, vb.x + vb.w / 2, vb.y + vb.h / 2);
document.getElementById("zin").onclick = () => centerZoom(1 / 1.4);
document.getElementById("zout").onclick = () => centerZoom(1.4);
document.getElementById("reset").onclick = () => { vb = { ...BASE }; apply(); };

// Search: dim non-matching zones; Enter flies to first match
const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  zonesG.querySelectorAll(".zone").forEach(g => g.classList.toggle("dim", q && !g.dataset.name.includes(q)));
});
search.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = search.value.trim().toLowerCase();
  const i = ZONES.findIndex(z => z[0].toLowerCase().includes(q));
  if (q && i >= 0) select(zonesG.children[i], ...ZONES[i]);
});
</script>
</body>
</html>
